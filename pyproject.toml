[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "militaryvision"
version = "0.1.0"
description = "Identity-first single-object visual tracking desktop MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.10,<5",
    "PySide6>=6.7,<7",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
militaryvision = "persistent_tracker.main:main"
persistent-tracker = "persistent_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=runtime/pytest"
cache_dir = "runtime/pytest-cache"
